version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install --upgrade pip
      - pip install -r backend/requirements.txt
run:
  runtime-version: 3.11
  command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers
  network:
    port: 8000
    env: APP_PORT
  health-check:
    path: /api/v1/health
    interval: 10
    timeout: 5
    healthy-threshold: 2
    unhealthy-threshold: 5
  env:
    - name: PYTHONPATH
      value: "."
    - name: SECRET_KEY
      value: "civiqone_dev_secret_key_99182_sovereign_identity"
